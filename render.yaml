services:
  - type: web
    name: btl-enquiry-server
    runtime: node
    plan: free
    buildCommand: "npm install --include=dev && npx prisma generate"
    startCommand: "npx prisma migrate deploy && npm run seed && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: REPORT_RECIPIENTS
        sync: false
      - key: REPORT_CRON_SECRET
        generateValue: true
